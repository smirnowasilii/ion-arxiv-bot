# Runs the bot in "once" mode every 4 hours on GitHub's servers — no machine of your own needed.
# Repo → Settings → Secrets and variables → Actions → add:
#   TELEGRAM_BOT_TOKEN  – token from @BotFather
#   TELEGRAM_CHAT_ID    – your chat id (send /start to the bot while it runs locally once, or use @userinfobot)
name: arxiv-trapped-ion-watch

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      test_days:
        description: "Test: resend all papers from the last N days (0 = normal run, only new papers)"
        default: "0"

permissions:
  contents: write   # to commit state.json (remembers which papers were already sent)

concurrency:
  group: arxiv-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          if [ "${TEST_DAYS:-0}" != "0" ]; then
            python bot.py once --test-days "$TEST_DAYS"
          else
            python bot.py once
          fi
        env:
          TEST_DAYS: ${{ inputs.test_days }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        run: |
          git config user.name "arxiv-bot"
          git config user.email "arxiv-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update seen papers [skip ci]"
          git push
